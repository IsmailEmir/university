<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шиномонтаж в Казани цена</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-btn-menu">
            <div class="header-btn-menu-left">
                <div class="city-btn btn">
                    <svg width="12" height="14" viewBox="0 0 12 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 0a6 6 0 0 1 6 6c0 2.484-1.893 5.087-5.6 7.867a.667.667 0 0 1-.8 0C1.893 11.087 0 8.484 0 6a6 6 0 0 1 6-6Zm0 1.333A4.667 4.667 0 0 0 1.333 6c0 1.807 1.412 3.89 4.299 6.204l.368.29.368-.29C9.255 9.891 10.667 7.807 10.667 6A4.667 4.667 0 0 0 6 1.333Zm0 3.334a1.333 1.333 0 1 1 0 2.666 1.333 1.333 0 0 1 0-2.666Z" fill="#000"></path></svg>
                    <div class="header-btn-text">Казань</div>
                    <svg width="5.66" height="3" viewBox="0 0 5 3" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M.014 0h4.973L2.5 2.984.014 0Z" fill="currentColor"></path></svg>
                </div>
                <div class="address-btn btn"><div class="header-btn-text">Гаврилова, 23</div></div>
            </div>

            <div class="header-btn-menu-right">
                <div class="actions-btn btn">
                    <svg class="actions-btn-logo" width="24" height="24" viewBox="0 0 25 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.574 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4.001 4.001 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#309"></path><path d="m15.724 9-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M9.724 9h.01M15.724 15h.01" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    <div class="header-btn-text">Акции</div>
                </div>

                <div class="partner-btn btn">
                    <div class="header-btn-text">Партнёрам</div>
                    <svg width="5.66" height="3" viewBox="0 0 5 3" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M.014 0h4.973L2.5 2.984.014 0Z" fill="currentColor"></path></svg>
                </div>

                <div class="buyers-btn btn">
                    <div class="header-btn-text">Покупателю</div>
                    <svg width="5.66" height="3" viewBox="0 0 5 3" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M.014 0h4.973L2.5 2.984.014 0Z" fill="currentColor"></path></svg>
                </div>

                <div class="favorites-btn btn">
                    <svg width="18" height="20" viewBox="0 0 19 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="m16.88 8.928-7.065 7.028h-.3L1.943 8.512l.01-.005a5.127 5.127 0 0 1-1.3-3.421A4.931 4.931 0 0 1 5.473.05 4.776 4.776 0 0 1 9.69 2.697 4.745 4.745 0 0 1 13.893.044a4.9 4.9 0 0 1 4.787 5 5.055 5.055 0 0 1-1.8 3.884Zm-1.276-1.6L9.78 13.252h-.245l-6.11-6.208.017-.02a2.989 2.989 0 1 1 4.621-3.78l.008-.007.037.058c.08.115.153.235.216.36l1.392 2.323 1.275-2.239c.066-.143.144-.28.232-.41A2.993 2.993 0 1 1 15.6 7.332l.004-.004Z" fill="#C4C4C4"></path></svg>
                    <div class="header-btn-text">Избранное</div>
                </div>

                <div class="account-btn btn">
                    <svg width="13" height="15" viewBox="0 0 13 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.368 4.447a3.947 3.947 0 1 1 7.895 0 3.947 3.947 0 0 1-7.895 0Zm3.948 2.369a2.368 2.368 0 1 0 0-4.737 2.368 2.368 0 0 0 0 4.737ZM1.85 11.034A6.316 6.316 0 0 0 0 15.5h1.579a4.737 4.737 0 0 1 9.474 0h1.579A6.317 6.317 0 0 0 1.85 11.034Z" fill="#000"></path></svg>
                    <div class="header-btn-text">Войти</div>
                </div>
            </div>

        </div>
    </header>

    <div class="header-middle">
        <div class="animated-logo"><img src="late-2024.gif" alt="" height="38px"></div>
        <div class="search-bar">
            <input id="search-bar-id" type="search" placeholder="Поиск, пример, шины 205 55 15">
        </div>
        <div class="header-middle-right">
            <div class="phone-number-menu">
                <div class="phone-number-text">8 (843) 204-02-57</div>
                <svg width="5.66" height="3" viewBox="0 0 5 3" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M.014 0h4.973L2.5 2.984.014 0Z" fill="currentColor"></path></svg>
            </div>
            <div class="shopping-cart">
                <svg width="28" height="25" viewBox="0 0 20 21" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m.125 1.001 2.81.61 2.383 13.991H17.17" stroke="#383838" stroke-width="1.7" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3.613 5.592h15.512L17.17 12.06H4.715" stroke="#383838" stroke-width="1.7" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"></path><path d="M6.603 20.734a1.65 1.65 0 1 0 0-3.299 1.65 1.65 0 0 0 0 3.3ZM15.52 20.734a1.65 1.65 0 1 0 0-3.299 1.65 1.65 0 0 0 0 3.3Z" fill="#383838"></path></svg>
                <div class="shopping-cart-text">Корзина</div>
            </div>
        </div>
    </div>
</body>
</html>
